<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>CalendarItem</title>
<link href="https://fonts.googleapis.com/css2?family=Saira+Semi+Condensed:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;padding:16px;display:grid;gap:4px;max-width:260px}.sim-swatches{margin-top:12px}</style></head>
<body>
<button class="sim-cal-block" style="height:64px">Focus block</button>
<button class="sim-cal-block sim-cal-block--ok" style="height:24px">Needs action</button>
<button class="sim-cal-block sim-cal-block--event" style="height:32px">Meeting</button>
<button class="sim-cal-block" style="height:46px;background:var(--moss)">Coloured item</button>
<button class="sim-cal-block sim-cal-block--due">Due: Report</button>
<div class="sim-swatches">
<button class="sim-swatch sim-swatch--default" aria-label="Default colour" aria-pressed="false"></button>
<button class="sim-swatch" aria-label="Steel" aria-pressed="false" style="background:var(--steel)"></button>
<button class="sim-swatch" aria-label="Moss" aria-pressed="true" style="background:var(--moss)"></button>
<button class="sim-swatch" aria-label="Amber" aria-pressed="false" style="background:var(--amber)"></button>
<button class="sim-swatch" aria-label="Rust" aria-pressed="false" style="background:var(--rust)"></button>
<button class="sim-swatch" aria-label="Plum" aria-pressed="false" style="background:var(--plum)"></button>
<button class="sim-swatch" aria-label="Slate" aria-pressed="false" style="background:var(--slate)"></button>
</div>
</body>
</html>
